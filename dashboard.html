<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | DevStage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0a0a0c;
        }

        .dashboard-card {
            width: 100%;
            max-width: 480px;
            background: #1c1c1f;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 48px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .user-avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 24px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            background: #2a2a2d;
        }

        .user-avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .dashboard-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
        }

        .dashboard-email {
            color: #b4b4bb;
            font-size: 1rem;
            margin-bottom: 24px;
        }

        .dashboard-meta {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 32px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
        }

        .meta-item {
            text-align: center;
        }

        .meta-label {
            font-size: 0.75rem;
            color: #71717a;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .meta-value {
            font-size: 0.9rem;
            color: #fff;
            font-weight: 600;
        }

        .dashboard-actions {
            display: grid;
            gap: 12px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Dev<span>Stage</span></a>
            <button id="dashboard-logout-btn" class="button-secondary" style="padding: 8px 20px;">Logout</button>
        </div>
    </nav>

    <div class="dashboard-wrapper">
        <div class="dashboard-card">
            <div class="user-avatar-large">
                <img id="user-photo" src="https://ui-avatars.com/api/?name=User&background=64748b&color=fff" alt="Profile">
            </div>
            
            <h1 id="user-name" class="dashboard-title">Welcome</h1>
            <p id="user-email" class="dashboard-email">loading...</p>
            
            <div class="dashboard-meta">
                <div class="meta-item">
                    <p class="meta-label">Joined</p>
                    <p class="meta-value">May 2024</p>
                </div>
                <div class="meta-item">
                    <p class="meta-label">Status</p>
                    <p class="meta-value">Active</p>
                </div>
            </div>

            <div class="dashboard-actions">
                <a href="index.html" class="button-primary">Go to Home</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <!-- Core Scripts -->
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCVetFMH6RBpDVDrX20OsrhxK8Z4m-PmIg",
          authDomain: "devstage-872b1.firebaseapp.com",
          projectId: "devstage-872b1",
          storageBucket: "devstage-872b1.firebasestorage.app",
          messagingSenderId: "993834630425",
          appId: "1:993834630425:web:b063407a7d47a0830d5988"
        };

        firebase.initializeApp(firebaseConfig);

        document.addEventListener('DOMContentLoaded', () => {
            const auth = firebase.auth();
            
            auth.onAuthStateChanged((user) => {
                if (user) {
                    document.getElementById('user-name').textContent = user.displayName || 'Developer';
                    document.getElementById('user-email').textContent = user.email;
                    if (user.photoURL) {
                        document.getElementById('user-photo').src = user.photoURL;
                    }
                } else {
                    // Redirect and trigger login modal on home page
                    window.location.href = 'index.html?action=login';
                }
            });
            
            document.getElementById('dashboard-logout-btn').addEventListener('click', async () => {
                try {
                    await auth.signOut();
                    window.location.href = 'index.html';
                } catch (error) {
                    console.error('Logout failed:', error);
                }
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | DevStage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            max-width: 800px;
            margin: 100px auto;
            padding: 40px;
            background: #1c1c1f;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .user-info {
            margin: 30px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
        }
        .user-email {
            font-size: 1.2rem;
            color: #fff;
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 12px;
            background: #00ff8822;
            color: #00ff88;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }
    </style>
</head>
<body style="cursor: auto;">
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Dev<span>Stage</span></a>
            <button id="dashboard-logout-btn" class="button-secondary" style="padding: 8px 20px;">Logout</button>
        </div>
    </nav>

    <main class="dashboard-container">
        <h1>Welcome to your Dashboard</h1>
        <p style="color: #b4b4bb;">You have successfully authenticated.</p>
        
        <div class="user-info">
            <p style="color: #71717a; font-size: 0.9rem; margin-bottom: 5px;">Signed in as:</p>
            <div id="display-user-email" class="user-email">User</div>
            <div class="status-badge">Session Active</div>
        </div>

        <div style="margin-top: 40px;">
            <a href="index.html" class="button-primary">Return to Home</a>
        </div>
    </main>

    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <!-- Core Scripts -->
    <script>
        // Your web app's Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyCVetFMH6RBpDVDrX20OsrhxK8Z4m-PmIg",
          authDomain: "devstage-872b1.firebaseapp.com",
          projectId: "devstage-872b1",
          storageBucket: "devstage-872b1.firebasestorage.app",
          messagingSenderId: "993834630425",
          appId: "1:993834630425:web:b063407a7d47a0830d5988"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        document.addEventListener('DOMContentLoaded', () => {
            const auth = firebase.auth();
            const emailDisplay = document.getElementById('display-user-email');
            
            // 1. PROTECTED ROUTE CHECK
            auth.onAuthStateChanged((user) => {
                if (user) {
                    console.log('[DevStage] Dashboard: User authenticated:', user.email);
                    emailDisplay.textContent = user.email;
                } else {
                    console.log('[DevStage] No session found, redirecting to home...');
                    window.location.href = 'index.html';
                }
            });
            
            // 2. LOGOUT HANDLER
            document.getElementById('dashboard-logout-btn').addEventListener('click', async () => {
                try {
                    await auth.signOut();
                    window.location.href = 'index.html';
                } catch (error) {
                    console.error('[DevStage] Logout failed:', error);
                }
            });
        });
    </script>
</body>
</html>

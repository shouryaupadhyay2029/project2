<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Your Project | DevStage</title>
    
    <!-- Premium Typography -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cursor.css">
</head>
<body class="upload-page">
    <nav class="navbar" id="main-navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Dev<span>Stage</span></a>
            <div class="nav-menu">
                <ul class="nav-links">
                    <li><a href="explore.html" class="nav-link">Explore</a></li>
                    <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="upload-wrapper" style="padding-top: 120px; padding-bottom: 60px;">
        <div class="upload-grid-container">
            
            <!-- LEFT: Upload Form -->
            <section class="upload-form-section">
                <div class="upload-card glass-card">
                    <div class="card-glow"></div>
                    <div class="section-header">
                        <i data-lucide="upload-cloud" class="brand-icon"></i>
                        <h2>Share a New Project</h2>
                        <p>Let the community discover your latest creation.</p>
                    </div>

                    <form id="project-upload-form" class="upload-form-layout">
                        <div class="floating-group">
                            <input type="text" id="project-title" required placeholder=" ">
                            <label for="project-title">Project Title</label>
                            <div class="input-accent"></div>
                        </div>

                        <div class="floating-group">
                            <textarea id="project-desc" required placeholder=" " rows="4"></textarea>
                            <label for="project-desc">Description</label>
                            <div class="input-accent"></div>
                        </div>

                        <div class="floating-group">
                            <input type="text" id="project-tech" placeholder=" ">
                            <label for="project-tech">Tech Stack (e.g. React, Node, GSAP)</label>
                            <div class="input-accent"></div>
                        </div>

                        <div class="file-upload-area" id="drop-zone">
                            <input type="file" id="project-file" accept="image/*,video/*" style="display: none;">
                            <div class="file-dummy">
                                <i data-lucide="image"></i>
                                <p id="file-label">Click or drag to upload thumbnail/demo</p>
                                <span class="file-hint">Supports PNG, JPG, WEBP (Max 5MB)</span>
                            </div>
                        </div>

                        <!-- Progress Bar (Glassmorphic) -->
                        <div id="upload-progress-container" style="display: none; margin: 20px 0;">
                            <div class="glass-progress-track">
                                <div id="upload-progress-bar" class="glass-progress-fill"></div>
                            </div>
                            <p id="upload-progress-text" class="progress-info">0% Complete</p>
                        </div>

                        <div id="upload-status" class="auth-message" style="display: none;"></div>

                        <button type="submit" id="upload-submit-btn" class="premium-btn" style="width: 100%; margin-top: 10px;">
                            <span>Share Project</span>
                        </button>
                    </form>
                </div>
            </section>

            <!-- RIGHT: Previous Uploads -->
            <aside class="previous-uploads-section">
                <div class="section-header-compact">
                    <i data-lucide="history"></i>
                    <h3>Your Previous Uploads</h3>
                </div>

                <div id="previous-projects-list" class="mini-upload-list">
                    <!-- Skeletons while loading -->
                    <div class="mini-skeleton"></div>
                    <div class="mini-skeleton"></div>
                </div>
            </aside>

        </div>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="upload.js"></script>
    <script src="cursor.js" defer></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>

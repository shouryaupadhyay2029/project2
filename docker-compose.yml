services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devstage-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/devstage
    depends_on:
      - mongo
    expose:
      - "5000"

  mongo:
    image: mongo:7
    container_name: devstage-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  nginx:
    image: nginx:1.27-alpine
    container_name: devstage-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/usr/share/nginx/html:ro

volumes:
  mongo-data:

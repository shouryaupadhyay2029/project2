<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | DevStage</title>

    <!-- Premium Typography: Clash Display & Inter -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@800&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="../styles/global.css">
    <script src="../scripts/cursor.js" defer></script>

</head>

<body class="dashboard-page">
    <script src="../scripts/motion-engine.js" defer></script>
    <nav class="navbar" id="main-navbar">
        <div class="nav-container">
            <a href="../index.html" class="logo-bloom-wrapper" id="devstage-logo">
                <div class="logo-chars">
                    <span class="char" style="--i:0">D</span>
                    <span class="char" style="--i:1">e</span>
                    <span class="char" style="--i:2">v</span>
                    <div class="logo-separator"></div>
                    <span class="char outline" style="--i:3">S</span>
                    <span class="char outline" style="--i:4">t</span>
                    <span class="char outline" style="--i:5">a</span>
                    <span class="char outline" style="--i:6">g</span>
                    <span class="char outline" style="--i:7">e</span>
                    <div class="logo-dot"></div>
                </div>
                <div class="logo-underline"></div>
            </a>
            <div class="nav-actions">
                <label class="uiverse-hamburger" id="hamburger-menu-label">
                    <input type="checkbox" id="hamburger-checkbox">
                    <svg viewBox="0 0 32 32">
                        <path class="line line-top-bottom" d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22"></path>
                        <path class="line" d="M7 16 27 16"></path>
                    </svg>
                    <div class="premium-dropdown" id="hamburger-dropdown" role="menu" aria-label="Main navigation">
                        <div class="dropdown-inner">
                            <div class="dropdown-group primary-nav">
                                <a href="../index.html" class="dropdown-item nav-item-anim"><i data-lucide="home" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Home</span></a>
                                <a href="explore.html" class="dropdown-item nav-item-anim"><i data-lucide="compass" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Explore</span></a>
                                <a href="feed.html" class="dropdown-item nav-item-anim"><i data-lucide="rss" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Feed</span></a>
                                <a href="challenges.html" class="dropdown-item nav-item-anim"><i data-lucide="trophy" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Challenges</span></a>
                                <a href="beginner.html" class="dropdown-item nav-item-anim"><i data-lucide="graduation-cap" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Beginner Zone</span></a>
                                <a href="teams.html" class="dropdown-item nav-item-anim"><i data-lucide="users" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Teams</span></a>
                                <a href="upload.html" class="dropdown-item nav-item-anim"><i data-lucide="upload" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Upload Project</span></a>
                            </div>
                            <div class="dropdown-divider" role="separator"></div>
                            <div class="dropdown-group secondary-nav">
                                <a href="dashboard.html" class="dropdown-item nav-item-anim active-page"><i data-lucide="layout-dashboard" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Dashboard</span></a>
                                <a href="profile.html" class="dropdown-item nav-item-anim"><i data-lucide="user" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Profile</span></a>
                                <a href="#" class="dropdown-item nav-item-anim"><i data-lucide="settings" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Settings</span></a>
                                <a href="#" class="dropdown-item nav-item-anim logout-btn" id="nav-logout-btn" role="menuitem"><i data-lucide="log-out" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Logout</span></a>
                            </div>
                        </div>
                    </div>
                </label>
            </div>
        </div>
    </nav>

    <main class="dashboard-wrapper" style="padding-top: 140px; padding-bottom: 80px;">
        <div class="dashboard-grid-layout">

            <!-- Left: Profile & Quick Stats -->
            <div class="dashboard-left-col">
                <div class="dashboard-card profile-card">
                    <div class="card-glow"></div>
                    <div class="user-avatar-large">
                        <img id="dash-avatar" src="https://ui-avatars.com/api/?name=User" alt="Avatar">
                    </div>
                    <h1 class="dashboard-title" id="dash-name">Developer Name</h1>
                    <p class="dashboard-email" id="dash-email">email@example.com</p>

                    <div class="dashboard-meta-tags">
                        <span class="meta-tag"><i data-lucide="calendar"></i> Joined <span id="dash-joined">May 2026</span></span>
                    </div>

                    <div class="dashboard-actions" style="margin-top: 32px;">
                        <a href="../index.html?action=upload" class="premium-btn"><span>Share New Project</span></a>
                        <button id="logout-btn" class="text-link-btn" style="margin-top: 12px; color: var(--error); opacity: 0.7;">Logout</button>
                    </div>
                </div>

                <!-- Stats Card -->
                <div class="dashboard-card stats-summary-card" style="margin-top: 24px;">
                    <div class="card-header-simple">
                        <i data-lucide="bar-chart-3"></i>
                        <h3>Project Summary</h3>
                    </div>
                    <div class="stats-mini-grid">
                        <div class="stat-mini-box">
                            <span id="dash-projects-count">0</span>
                            <label>Projects</label>
                        </div>
                        <div class="stat-mini-box">
                            <span id="dash-total-likes">0</span>
                            <label>Total Likes</label>
                        </div>
                        <div class="stat-mini-box">
                            <span id="dash-total-views">0</span>
                            <label>Total Views</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Activity Feed -->
            <div class="dashboard-card activity-card">
                <div class="card-glow"></div>
                <div class="card-header-icon">
                    <i data-lucide="zap" style="color: var(--brand-orange)"></i>
                    <h3>Recent Activity</h3>
                </div>

                <div id="user-activity-list" class="dashboard-activity-list">
                    <!-- Activities will be injected by JS -->
                    <div class="activity-loading">
                        <p>Syncing your community impact...</p>
                    </div>
                </div>

                <div class="dashboard-footer-hint">
                    <p>Activities are updated in real-time as the community interacts with your work.</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../scripts/nav-dropdown.js" defer></script>
    <script src="../scripts/firebase-config.js" defer></script>
    <script src="../scripts/dashboard.js" defer></script>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | DevStage</title>

    <!-- Premium Typography: Clash Display & Inter -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@800&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="../styles/global.css">
    <script src="../scripts/cursor.js" defer></script>

</head>

<body class="profile-page">
    <script src="../scripts/motion-engine.js" defer></script>
    <nav class="navbar" id="main-navbar">
        <div class="nav-container">
            <a href="../index.html" class="logo-bloom-wrapper" id="devstage-logo">
                <div class="logo-chars">
                    <span class="char" style="--i:0">D</span>
                    <span class="char" style="--i:1">e</span>
                    <span class="char" style="--i:2">v</span>
                    <div class="logo-separator"></div>
                    <span class="char outline" style="--i:3">S</span>
                    <span class="char outline" style="--i:4">t</span>
                    <span class="char outline" style="--i:5">a</span>
                    <span class="char outline" style="--i:6">g</span>
                    <span class="char outline" style="--i:7">e</span>
                    <div class="logo-dot"></div>
                </div>
                <div class="logo-underline"></div>
            </a>
            <div class="nav-actions">
                <label class="uiverse-hamburger" id="hamburger-menu-label">
                    <input type="checkbox" id="hamburger-checkbox">
                    <svg viewBox="0 0 32 32">
                        <path class="line line-top-bottom" d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22"></path>
                        <path class="line" d="M7 16 27 16"></path>
                    </svg>
                    <div class="premium-dropdown" id="hamburger-dropdown" role="menu" aria-label="Main navigation">
                        <div class="dropdown-inner">
                            <div class="dropdown-group primary-nav">
                                <a href="../index.html" class="dropdown-item nav-item-anim"><i data-lucide="home" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Home</span></a>
                                <a href="explore.html" class="dropdown-item nav-item-anim"><i data-lucide="compass" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Explore</span></a>
                                <a href="feed.html" class="dropdown-item nav-item-anim"><i data-lucide="rss" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Feed</span></a>
                                <a href="challenges.html" class="dropdown-item nav-item-anim"><i data-lucide="trophy" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Challenges</span></a>
                                <a href="beginner.html" class="dropdown-item nav-item-anim"><i data-lucide="graduation-cap" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Beginner Zone</span></a>
                                <a href="teams.html" class="dropdown-item nav-item-anim"><i data-lucide="users" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Teams</span></a>
                                <a href="upload.html" class="dropdown-item nav-item-anim"><i data-lucide="upload" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Upload Project</span></a>
                            </div>
                            <div class="dropdown-divider" role="separator"></div>
                            <div class="dropdown-group secondary-nav">
                                <a href="dashboard.html" class="dropdown-item nav-item-anim"><i data-lucide="layout-dashboard" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Dashboard</span></a>
                                <a href="profile.html" class="dropdown-item nav-item-anim active-page"><i data-lucide="user" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Profile</span></a>
                                <a href="#" class="dropdown-item nav-item-anim"><i data-lucide="settings" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Settings</span></a>
                                <a href="#" class="dropdown-item nav-item-anim logout-btn" id="nav-logout-btn" role="menuitem"><i data-lucide="log-out" class="nav-menu-icon" aria-hidden="true"></i><span class="nav-menu-label">Logout</span></a>
                            </div>
                        </div>
                    </div>
                </label>
            </div>
        </div>
    </nav>

    <main class="profile-wrapper">
        <!-- Profile Header Section -->
        <header class="profile-header">
            <div class="header-banner"></div>
            <div class="header-content">
                <div class="profile-avatar-wrapper">
                    <img id="profile-avatar" src="https://ui-avatars.com/api/?name=User" alt="Profile Avatar">
                    <div class="avatar-glow"></div>
                </div>
                <div class="profile-info-main">
                    <h1 id="profile-name">Developer Name</h1>
                    <p id="profile-email">email@example.com</p>
                    <div class="profile-social-links">
                        <a href="#" id="link-github" class="social-link-icon" target="_blank"><i data-lucide="github"></i></a>
                        <a href="#" id="link-linkedin" class="social-link-icon" target="_blank"><i data-lucide="linkedin"></i></a>
                    </div>
                </div>
                <div class="profile-bio-section">
                    <p id="profile-bio">Passionate developer building the future of the web. Sharing my journey one project at a time.</p>
                </div>
            </div>
        </header>

        <!-- Tabs Navigation -->
        <div class="profile-tabs-container">
            <div class="profile-tabs">
                <button class="tab-btn active" data-tab="projects">
                    <i data-lucide="folder"></i> Projects
                </button>
                <button class="tab-btn" data-tab="github">
                    <i data-lucide="code-2"></i> GitHub
                </button>
                <button class="tab-btn" data-tab="activity">
                    <i data-lucide="zap"></i> Activity
                </button>
            </div>
        </div>

        <!-- Tabs Content -->
        <div class="profile-content">
            <!-- Projects Tab -->
            <section id="tab-projects" class="tab-content active">
                <div id="user-projects-grid" class="discovery-grid">
                    <!-- Projects injected here -->
                    <p class="empty-msg">No projects shared yet.</p>
                </div>
            </section>

            <!-- GitHub Tab -->
            <section id="tab-github" class="tab-content">
                <div class="github-profile-card">
                    <div id="gh-setup" class="github-setup-ui">
                        <h3>Connect GitHub</h3>
                        <p>Sync your repositories to showcase your open source contributions.</p>
                        <div class="gh-input-group">
                            <input type="text" id="gh-username-input" placeholder="Enter GitHub Username">
                            <button id="gh-sync-btn" class="premium-btn"><span>Sync</span></button>
                        </div>
                    </div>

                    <div id="gh-display" class="github-display-ui" style="display: none;">
                        <div class="gh-header">
                            <h4>Top Repositories</h4>
                            <span id="gh-repo-count" class="badge">0 Repos</span>
                        </div>
                        <div id="gh-repo-list" class="mini-repo-list"></div>
                    </div>
                </div>
            </section>

            <!-- Activity Tab -->
            <section id="tab-activity" class="tab-content">
                <div id="user-activity-feed" class="dashboard-activity-list" style="max-width: 800px; margin: 0 auto;">
                    <!-- Activity items injected here -->
                </div>
            </section>
        </div>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../scripts/nav-dropdown.js" defer></script>
    <script src="../scripts/firebase-config.js" defer></script>
    <script src="../scripts/profile.js" defer></script>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>

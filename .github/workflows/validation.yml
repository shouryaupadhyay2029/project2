name: Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax check backend JavaScript
        working-directory: backend
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n 1 node --check

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit
